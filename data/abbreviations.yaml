# Abbreviations Burton uses in his sidenotes (SPEC §4.2). Read by `burton citations` (burton/layers/citations.py).
#
# Provenance: drafted by Claude (claude-opus-5-5) in session on 2026-11-02 (M6), from token counts over the
# 5,703 sidenotes' public text. Status: machine-draft; the owner reviews the authors through the top-100 list
# (state/review/authors-top100.md). A form is listed only where its reading in Burton is certain; a form that
# could name two people goes under `ambiguous` and resolves only by its work (or not at all). Unknown forms
# are simply absent: the parser then records the citation as `unidentified`, never as a guess.
version: abbrev-v1
provenance: {by: machine, model: claude-opus-5-5, date: "2026-11-02", status: machine-draft}

# Locus abbreviations. `en` is the display label. A locator counts only when a number follows it.
