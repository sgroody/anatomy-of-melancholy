# Ambiguous forms. A citation resolves to the candidate whose work (data/works.yaml) it names, else to the one
# a locator in `by_locus` points to, else to `default` where one is given with its `basis`; otherwise it stays
# unidentified and records `ambiguous_with`.
ambiguous:
  Scaliger: &scaliger
    candidates: [scaliger-julius-caesar, scaliger-joseph-justus]
    by_locus: {exercitation: scaliger-julius-caesar}
  Scalig: *scaliger
  Plin: &pliny
    candidates: [pliny-elder, pliny-younger]
    by_locus: {letter: pliny-younger}
    default: pliny-elder
    basis: Burton cites the Natural History by book and chapter; the Younger only by his letters (epist.).
  Plinius: *pliny
  Pliny: *pliny
  Seneca: &seneca
    candidates: [seneca-younger, seneca-elder]
    by_locus: {controversy: seneca-elder}
    default: seneca-younger
    basis: Burton's bare "Seneca" is the philosopher and tragedian; the Elder appears by his Controversiae (cont.).
  Senec: *seneca
  Sen: *seneca
  # the philosopher (De consolatione) or Hector Boece (the Scottish history)
  Boethius: &boethius
    candidates: [boethius, boethius-hector]
  Boeth: *boethius
  Herod:
    candidates: [herodotus, herodian]

