# Works Burton cites, by author (SPEC §4.2). Read by `burton citations`.
#
# Provenance: drafted by Claude (claude-opus-5-5) in session on 2026-11-02 (M6), from the work words of the
# citations the parser left `partial`. Status: machine-draft. A citation's work words match a work when each
# word is a prefix of the matching word of its title or of one of its `forms` ("de occult. nat. mir." ->
# "De occultis naturae miraculis"); a leading "Lib."/"Tract." is ignored. A citation names a work only when
# exactly one work of its author matches; otherwise it stays `partial`. Titles are the conventional Latin ones.
# `alone`: the exact forms by which the title alone names its author in a note ("Eunuch." -> Terence), listed
# only for distinctive titles. Without one, a lone title resolves only through the author named at the anchor
# (held-out round c1 showed that matching a lone abbreviation by prefix is not safe).
