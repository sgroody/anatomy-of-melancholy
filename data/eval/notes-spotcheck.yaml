population: 5523
raters: 'first: Claude in session; second: a model blind via `burton note-rate --audit` (prompt note-audit-v1). The notes''
  writer is the same model family, so errors it makes systematically may be missed by both raters.'
labels:
  accuracy:
    sound: every claim of fact in the note is right, or hedged as it should be
    doubtful: a claim that may be wrong, or is stated more surely than the evidence allows
    wrong: a claim of fact that is wrong (a source, a date, a meaning, what Burton did)
  usefulness:
    3: 'tells a reader something worth knowing beside the text: an allusion, the source and how Burton bends it, a term''s
      sense, context'
    2: correct but slight; a reader loses little without it
    1: a translator's working note (word choice, grammar, literal sense) or a repetition of the translation
rules:
  R1: 'accuracy: notes adjudicated `wrong` at most 3 % of the sample'
  R2: of the notes the rating pass would show (rated 3, not doubtful), none adjudicated `wrong`
  on_failure: reported with its numbers; no note is shown in the margin until the owner decides
