# M4 translation pilot: 50 hard passages (PLAN M4). Chosen 2026-10-20 by Claude from the
# M2 base text and the self-translation signals in data/layers/selftrans/ (rules only).
#
# Choosing is not translating: nothing here renders the passages. Each item gives its stratum,
# why it is hard, and the self-translation verdict a correct answer should give.
#
# `expected_st`: the verdicts (SPEC §6.2) that count as correct, read by Claude from Burton's
#   text around the passage. Drafted, like the D7 gold labels: the owner reviews them with the
#   rubric. `gate: true` marks the self-translation items for the M4 exit criterion.
#   Three labels were revised after the runs, each toward the models' answer; the draft is kept as
#   `expected_st_draft` with the reason in `revised`, and the report scores both. The owner confirmed
#   the three revisions on 2026-10-23.
# `kind: gloss-only` (Chaucer): Middle English in Gowland's modernised spelling. It gets glosses
#   of obsolete words, never a translation. These items are keyed by their verse-group id,
#   because ingest does not tag Chaucer's 83 `lucida` spans as `enm` passages (see notes below).
#
# Notes on the strata (counts are from the 7,785 foreign passages after M2):
# * Italian and French: the base text has one passage tagged `it` (djr-f1477) and none tagged
#   `fr`. The only Italian quotation found is tagged `la` (3.3.2.1-f5); "à la mort" (1.3.1.4) is
#   French but untagged, so it is not a passage. The stratum therefore has 3 Italian items.
# * Chaucer: not in the translation queue at all (no `enm` tagging yet; SURVEY §6 says to tag it).
# * Long prose: only 2 prose passages in running text have 70+ words; 9 have 40-69.
# * Misquotation notes give the standard text only as a reviewer's check; they are never sent to
#   a model and are not attributions in any layer.
version: 1
prompt_from: tr-v2
items:
