purpose: 'M5 spot-check of the machine translation layer: a random 2 % of all passages, plus every record the runner''s
  post-checks flagged. Drawn, and the rules below fixed, before any labelling.'
drawn: '2026-10-28'
seed: 20261030
population: 7769
raters: 'first: Claude in session (claude-opus-5-5); second: claude-opus-5-5 blind via `burton tr-audit` (prompt
  tr-audit-v1). Disagreements adjudicated with reasons. The translator is the same model, so errors the model makes
  systematically may be missed by both raters.'
labels:
  translation:
    good: accurate and complete
    minor: a small slip (a word, a nuance, number or tense) that does not mislead about the sense
    error: the sense is wrong, or part of the passage is missing or added, or it misleads
  self_translation:
    ok: the verdict (none/full/partial/paraphrase/undetermined) fits Burton's text
    wrong: it claims a rendering that is not there, or misses one plainly beside the passage, or misjudges full
      vs partial vs paraphrase so that the reader would be misled
  source:
    ok: 'unidentified; or the claim is supported (burton-cites: Burton''s own words name that source; probable:
      a stated basis that holds)'
    unsupported: an attribution that the evidence does not support, or that is wrong
rules:
  R1: 'random sample: translation errors at most 5 % (at most 7 of 156) after adjudication'
  R2: 'random sample: unsupported source claims at most 2 % of the attributed claims in it; and every unsupported
    claim found anywhere in this check is downgraded to unidentified, recorded as a decision in data/manual/'
  R3: 'random sample: wrong self-translation verdicts at most 5 % (at most 7 of 156)'
  on_failure: a failed R1 or R3 is reported with its numbers and a corrective pass is proposed to the owner; nothing
    is re-run automatically
  errors: every translation adjudicated `error` (sample or flagged) is re-translated through the runner and the
    new version checked by the same two raters; one still in error is queued in state/review/translate.jsonl and
    reported as deferred
