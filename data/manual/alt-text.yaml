# Alternative text for images (editorial, resp="#editor"). The source EPUB has alt="" everywhere.

pg003.png:
  unit: argument
  alt: >-
    Engraved title page of the 1628 third edition, signed by C. Le Blon, in ten compartments.
    Top row: Zelotypia (jealousy: birds and fighting beasts in a landscape), Democritus Abderites
    seated under a tree beside a walled garden, and Solitudo (deer, hares and other animals in a
    wood). Middle row: Inamorato, a young man in a broad hat with folded arms; the printed title
    "The Anatomy of Melancholy … by Democritus Junior … The third Edition, corrected and augmented
    by the Author"; and Hypocondriacus, leaning on his arm among pots and glasses. Lower row:
    Superstitiosus kneeling with a rosary, a portrait of Burton as "Democritus Junior" holding a
    book, and Maniacus naked in chains. Bottom: the plants Borago and Helleborus flanking the
    imprint "Oxford, Printed for Henry Cripps, 1628". Planetary and astrological signs float in the
    clouds above the panels.
  checked: "2026-10-20, against the image"

