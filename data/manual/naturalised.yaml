# Latin words already naturalised in English before 1621, read as English when one stands alone as an italic
# run in Burton's English ("to repeat verbatim", "Decorum"). Burton italicised them as he italicised much else;
# the rater and the gold rounds read them as English (held-out h4, 2026-11-19). A word used in Latin context
# stays Latin: the rule applies only to a run of exactly one word. `alias` is left out: in Burton it is mostly
# the Latin locator ("& passim alias"). Dates: first English use, from the OED (decision: editor, 2026-11-19).
words:
  decorum: 1568
  verbatim: 1481
  gratis: 1475
  interim: 1548
  finis: 1440
  extempore: 1553
  memorandum: 1433
