# The Synopsis of the Second Partition: the tree's shape (M7). Words are never written here: each node names a
# hidden-table paragraph (chapter002.xhtml) by id, and `burton synopses` takes its text from there verbatim.
#   p:        the paragraph that is this node's text
#   or:       the "or" paragraph Burton sets before this node (its relation to the sibling before it)
#   head:     a column heading printed above this node ("Memb.", "Subsect.", "1st Subsect.")
#   label:    a second paragraph printed as part of this node ("Matter & quality." + "1st Subsect.")
#   num:      the level of the node's bare leading number, as the image shows it (a "Memb." heading over the
#             column, or the explicit "1st Memb." of the first sibling): memb or subsect
#   key:      on a tree root, the standalone cross-key paragraph above it; `sign` when the key is inside the
#             root's own text ("♈ Sect. 2. Dietetical ..."); `supplied` when the image prints no key (with why)
#   see:      the cross-key(s) this node points to; each target is the tree root carrying that key
#   img:      the image a tree root starts on
#   children: the brace hanging from this node, top to bottom as printed
# Where one image has several identical "or" paragraphs and the hidden order does not say which is which, each
# is given to the brace nearest the column it follows in the hidden order; the text is the same either way.
