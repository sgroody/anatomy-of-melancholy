# The frontispiece's panels (M8), each tied to the stanza of "The Argument of the Frontispiece" that
# describes it. Only the shape is recorded here: a rectangle in the image's own pixels (pg003.png,
# 1151 x 1900; x, y = top left), a name for the panel (editorial, the forms used in alt-text.yaml; not a
# transcription of the engraved caption), and the stanza's verse group id in the base text. The stanza
# text itself is never copied here; the site takes it from data/text/argument.xml.
