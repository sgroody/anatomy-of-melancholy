V5:
  decision: D10
  date: 2026-10-20
  reason: >-
    Language-ID is below target on the gate round. Updated 2026-11-18: the rules gained the sidenote-title rule and
    now read Burton's notes inside quotations (h2 became a seen round); a fresh round h3 (300 items, drawn after the
    change, labelled blind by the gold-audit-v1 rater, 4 Chaucer labels corrected from the source's markup) scores
    P 0.962, R 0.952, B 0.960 (targets 0.98 / 0.97 / 0.95). Remaining errors: Latin titles in the running text
    ("de atra bile") read as quoted Latin, two missed Latin phrases, three missed mixed phrases. Fixing them needs
    another cycle (h3 seen, rules changed, a fresh round h4); it stays deferred under D10 until then.
    Updated 2026-11-18 (second cycle): h3 became a seen round; the rules gained Latin titles as citations (after
    "book", "tract", "consultation"…, after an author or a title abbreviation, "De X" in a sidenote), Latin pronoun
    and possessive forms, Latin with only Latin-ambiguous "English" words, superscript endings joined to their run,
    and a Latin clause inside an English italic run (h3 now P 0.991, R 1.000, B 0.943; tuning, h1, h2 unchanged).
    A fresh round h4 (300 items, seed 20261119, drawn after the change, labelled blind by gold-audit-v1, no label
    corrected: none stands in Chaucer markup) scores P 0.948, R 0.968, B 0.912 (targets 0.98 / 0.97 / 0.95), so it
    stays deferred. h4's errors: 5 false Latin (English loan-words "Decorum", "verbatim"; locators "& passim alias",
    "& deinceps" that Gowland's brackets translate; a title "Originem in Celsum, &c" in a sidenote), 3 missed
    (capitalised Latin read as names: "Scytala Laconica", "Capuae Fluenta"; one mixed roman passage). Of the 8
    inexact boundaries, 6 are labels that join separate stretches with "|", which the scorer can never count as
    exact; that is a measurement limit to settle before the next round is drawn, not a reason to pass this one.
    Updated 2026-11-19 (third cycle): h4 became a seen round; the rules gained Latin words naturalised in English
    (data/manual/naturalised.yaml), locators as citations even before a bracket ("20 & passim alias"), "Author in
    Work" references ("Originem in Celsum"), and lowercase Latin lists kept whole ("horribile, dirum, pestilens");
    the scorer now measures a label of "|"-joined stretches stretch by stretch (settled before h5 was drawn). h4 now
    P 1.000, R 0.979, B 0.957; tuning, h1, h2 unchanged; h3 B 0.962 (scorer). A fresh round h5 (300 items, seed
    20261120, drawn after the change, labelled blind by gold-audit-v1, 1 Chaucer label corrected from the source's
    markup) scores P 0.959, R 0.940, B 0.979 (targets 0.98 / 0.97 / 0.95), so it stays deferred. h5's errors:
    4 false (sidenote abbreviated titles "rebus gestis Alph.", "Gaspar Ens polit."; "Genius" and "per annum" used as
    English), 6 missed (single Latin words "inquis", "Pythonissas", "Napthe", "Protobib."; roman Latin without a
    bracket "de rebus caelestibus", "in summo gradu"). Three cycles on fresh rounds give P 0.95-0.96, R 0.94-0.97:
    each round brings rare constructions the earlier ones did not, so rule changes have stopped converging. The
    obvious next lever, sending short ambiguous runs to the model, would be scored against gold labelled by the
    same model; until a human-checked gate exists (PLAN D7) that would partly measure the model agreeing with itself.
