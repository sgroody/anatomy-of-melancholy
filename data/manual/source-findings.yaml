# Source findings beside the recorded attribution (M6, owner 2026-11-02: "record both Burton's attribution and
# your disagreement with it"). Hand decisions: made by Claude (claude-opus-5-5) in session on the owner's
# delegation, from the verifier's text match and the independent checker (prompt source-audit-v1). The
# attribution is copied as recorded and never changed; the reader shows both. V7 checks that each attribution
# still equals the translation layer's claim and that the text match stands.
# finding: agrees (the attributed author is the source; the corpus has the words as quoted by `text_found_in`)
#          agrees-locus-differs (same author, Burton's book or chapter differs)
#          words-of-transmitter (Burton names the author his source names; the Latin words are the source's own)
#          cites-intermediary (Burton cites where he read it; the words are `text_found_in`'s)
#          disagrees (the words are `text_found_in`'s, not the attributed author's)
