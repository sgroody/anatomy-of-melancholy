# Block-level decisions the rules cannot make. Each was checked against the EPUB on 2026-10-20.
# `from`/`to` are EPUB ids of an element inside the first/last top-level block of the range.
# These decisions add markup only (attributes, wrappers); they never change text.

language:
  # Whole blocks in a foreign language, set in roman type, so italics give no signal.
  - unit: dedication
    from: nat0005334
    to: nat0005353
    lang: la
    note: Latin dedication to George, Lord Berkeley, set as capitals and small capitals.
  - unit: ad-librum
    head: nat0005362
    lang: la
    note: Latin title "Democritus Junior ad Librum suum".
  - unit: ad-librum
    from: nat0005364
    to: nat0005364
    lang: la
    note: The Latin poem (one verse group).
  - unit: lectori
    head: nat0006284
    lang: la
    note: Latin title "Lectori male feriato".
  - unit: lectori
    from: nat0006285
    to: nat0006289
    lang: la
    note: Latin prose address to the reader, with one verse quotation.
  - unit: heraclite
    from: nat0000010
    to: nat0000010
    lang: la
    note: Latin poem "Heraclite fleas".

gowland:
  # Gowland's own translations that are not bracketed, so the bracket rule cannot see them.
  - unit: dedication
    from: nat0005354
    to: nat0005361
    note: '"[Translation]" heading and Gowland''s English version of the dedication.'
  - unit: heraclite
    from: nat0000020
    to: END
    note: '"[Translation]" heading and Gowland''s verse translation of the poem.'
  # Not a translation, but the edition's own matter in the same way (checked 2026-11-03 against index.xhtml).
  - unit: table
    from: inx00001
    to: inx00001
    note: >-
      The ebook's note on the Table ("The page references in this index correspond to the print edition …
      use the search feature of your ebook reader"): Penguin's, not Burton's.

inline:
  # Phrase-level language decisions the rules get wrong (found by the M4 pilot, checked 2026-10-23).
  # `in` is the EPUB id of the block that holds the text. One of:
  #   phrase: exact text, found once in that block; it becomes one foreign passage
  #   whole: true — the block's entire content is one foreign passage
  #   verse: true — the verse group containing `in` is one foreign passage
  # Markup only; the rules leave anything marked here alone.
  - unit: 3.3.2.1
    in: nat0015308
    verse: true
    lang: it
    note: Italian proverb "Chi non tocca parentado, / Tocca mai e rado" (the rules said la).
  - unit: 3.2.5.3
    in: nat0014257
    phrase: a bella Donna
    lang: it
    note: Italian "a bella Donna" (the rules said la).
  - unit: 1.3.1.4
    in: nat0002665
    phrase: à la mort
    lang: fr
    note: French "à la mort", set in roman, so the italic rules never saw it.
  - unit: 3.2.5.1
    in: nat0014005
    whole: true
    lang: la
    note: >-
      "Huc faciunt medicamenta Venerem sopientia, …" is Latin from end to end (a recipe paragraph);
      the rules cut it into a dozen passages and left Latin between them untagged.
