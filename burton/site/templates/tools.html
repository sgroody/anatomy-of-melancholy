{# the search, options and light/dark signs: in the running head, and on the front page in its about box #}
{# the search box opens in place; Enter goes to the results (owner, 2026-11-18); without script, the link #}
<form class="hsearch" action="{{ root }}search/" method="get" role="search"><input name="q" type="search" placeholder="Search the Anatomy" aria-label="Search the Anatomy" autocomplete="off"></form>
<a class="search-link" href="{{ root }}search/" aria-label="Search" title="Search"{% if key == "search" %} aria-current="page"{% endif %}><svg class="ic" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg></a>
{% if key != "settings" %}
<button class="settings-toggle" type="button" aria-expanded="false" aria-controls="settings" aria-label="Reading options" title="Reading options">Aa</button>
{% endif %}
<button class="theme-toggle" type="button" aria-label="Dark or light" title="Dark or light"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></svg></button>
