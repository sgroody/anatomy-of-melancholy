{% extends "base.html" %}
{% block main %}
<div class="home-page">
  <h1>The Anatomy of Melancholy</h1>
  <p class="sub">Robert Burton · a reading edition</p>
  {% set src, alt, w, h = frontispiece %}
  {% if front_map %}
  <figure class="frontispiece">
    {{ front_map }}
  </figure>
  {% else %}
  <figure class="frontispiece">
    <a href="{{ src }}"><img src="{{ src }}" alt="{{ alt }}" width="{{ w }}" height="{{ h }}" decoding="async"></a>
    <figcaption>The engraved title page of 1628.</figcaption>
  </figure>
  {% endif %}
  <section aria-labelledby="contents-h">
    <h2 id="contents-h">Contents</h2>
    <nav aria-labelledby="contents-h" class="toc-main">{{ contents }}</nav>
  </section>
</div>
{% endblock %}
