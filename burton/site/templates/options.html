<fieldset>
  <legend>Foreign-language passages</legend>
  <label><input type="radio" name="mode" value="gloss" checked> Original, with translations in the margin (on tap on a phone)</label>
  <label><input type="radio" name="mode" value="interlinear"> Interlinear: translation beneath</label>
  <label><input type="radio" name="mode" value="english"> Translations in the line: the English in place of the original, in its colour and italic; the original on hover</label>
</fieldset>
<fieldset>
  <legend>Translation shown first</legend>
  <label><input type="radio" name="order" value="default" checked> {% if profile == "private" %}Gowland 2021 first, then other human translations, then machine{% else %}Human translation, then machine{% endif %}</label>
  {% if profile == "private" %}<label><input type="radio" name="order" value="human"> Editor’s and Dell &amp; Jordan-Smith’s first, then Gowland, then machine</label>{% endif %}
  <label><input type="radio" name="order" value="machine"> Machine translation first</label>
</fieldset>
<fieldset>
  <legend>Citations</legend>
  <label><input type="checkbox" name="cites"> Show Burton’s own abbreviations (“Scalig. exercit. 365”) instead of their expansions</label>
</fieldset>
<fieldset>
  <legend>Obsolete words</legend>
  <label><input type="checkbox" name="glosses"> Gloss other obsolete English words in the line (Webster 1913 and machine glosses, each labelled){% if profile == "private" %}; Gowland’s glosses are always in the margin{% endif %}</label>
</fieldset>
<fieldset>
  <legend>Colour of the Latin</legend>
  <label><input type="radio" name="latin" value="oxblood" checked> Oxblood by day, candle-gold by night</label>
  <label><input type="radio" name="latin" value="green"> Green by day, sea-green by night</label>
  <label><input type="radio" name="latin" value="plain"> Ink, like the rest of the text</label>
  <label><input type="radio" name="latin" value="custom"> My own colours:</label>
  <span class="la-custom"><label>day <input type="color" name="laLight" value="#7a2230"></label> <label>night <input type="color" name="laDark" value="#e0c27a"></label></span>
</fieldset>
<fieldset>
  <legend>Theme</legend>
  <label><input type="radio" name="theme" value="auto" checked> Follow the system</label>
  <label><input type="radio" name="theme" value="light"> Light</label>
  <label><input type="radio" name="theme" value="dark"> Dark</label>
</fieldset>
<fieldset>
  <legend>Type size</legend>
  <label><input type="radio" name="size" value="s"> Smaller</label>
  <label><input type="radio" name="size" value="m" checked> Normal</label>
  <label><input type="radio" name="size" value="l"> Larger</label>
  <label><input type="radio" name="size" value="xl"> Largest</label>
</fieldset>
{% if profile == "private" %}
<fieldset>
  <legend>Gowland’s edition (2021)</legend>
  <label><input type="checkbox" name="gowland"> Show Gowland’s bracketed translations</label>
  <label><input type="checkbox" name="pages"> Show Penguin page numbers</label>
</fieldset>
{% endif %}
